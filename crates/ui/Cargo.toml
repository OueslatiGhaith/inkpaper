[package]
name = "inkpaper-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["embedded-graphics", "ttf", "metrics"]
defmt = ["dep:defmt", "heapless/defmt"]
embedded-graphics = ["dep:embedded-graphics", "embedded-graphics/defmt"]
ttf = ["dep:ttf-parser"]
metrics = []

[dependencies]
defmt = { workspace = true, optional = true }
embedded-graphics = { workspace = true, optional = true }
heapless = { workspace = true }
ttf-parser = { version = "0.25.1", optional = true, default-features = false, features = ["no-std-float", "opentype-layout"] }

[dev-dependencies]
criterion = "0.8.2"
embedded-graphics-simulator = { workspace = true }

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "layout_scenarios"
harness = false

[[bench]]
name = "work_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "visual_operation_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "damage_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "partial_paint_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "partial_paint_scroll_depth_metrics"
harness = false
required-features = ["metrics"]
