[package]
name = "inkpaper-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["ttf", "variable-fonts", "macros"]
alloc = []
macros = ["dep:inkpaper-ui-macros"]
defmt = ["dep:defmt", "heapless/defmt"]
embedded-graphics = ["dep:embedded-graphics", "embedded-graphics/defmt"]
eink = ["dep:embedded-graphics", "embedded-graphics/defmt"]
ttf = ["dep:ttf-parser"]
variable-fonts = ["ttf", "ttf-parser/variable-fonts"]
hinting = ["ttf", "dep:skrifa", "dep:spin"]
metrics = []

[dependencies]
defmt = { workspace = true, optional = true }
embedded-graphics = { workspace = true, optional = true }
heapless = { workspace = true }
inkpaper-ui-macros = { path = "../ui-macros", optional = true }
inkpaper-ui-style-schema = { path = "../ui-style-schema" }
num-traits = { version = "0.2.19", default-features = false }
skrifa = { version = "0.44.0", optional = true, default-features = false, features = ["libm"] }
spin = { version = "0.12.3", optional = true, default-features = false, features = ["spin_mutex"] }
ttf-parser = { version = "0.25.1", optional = true, default-features = false, features = ["no-std-float", "opentype-layout"] }

[dev-dependencies]
# runs the hinting tests with the rest of the crate's tests
inkpaper-ui = { path = ".", features = ["hinting"] }
criterion = "0.8.2"
embedded-graphics-simulator = { workspace = true }
trybuild = "1.0.121"

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "layout_scenarios"
harness = false

[[bench]]
name = "work_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "visual_operation_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "damage_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "partial_paint_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "partial_paint_scroll_depth_metrics"
harness = false
required-features = ["metrics"]

[[bench]]
name = "glyph_hinting"
harness = false
required-features = ["hinting"]
