[package]
name = "inkpaper-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["embedded-graphics"]
embedded-graphics = ["dep:embedded-graphics"]
metrics = []

[dependencies]
embedded-graphics = { version = "0.8.2", optional = true }
heapless = "0.9.3"

[dev-dependencies]
criterion = "0.8.2"
embedded-graphics-simulator = "0.8.0"

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "layout_scenarios"
harness = false

[[bench]]
name = "work_metrics"
harness = false
required-features = ["metrics"]