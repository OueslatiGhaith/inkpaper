[package]
name = "inkpaper-trace"
version = "0.1.0"
edition = "2024"

[features]
default = ["recording"]
recording = []

[dependencies]
inkpaper-trace-macros = { path = "../trace-macros" }

[target.'cfg(target_os = "none")'.dependencies]
critical-section = { workspace = true }

[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { workspace = true, features = ["std"] }
