[package]
name = "inkpaper-app"
version = "0.1.0"
edition = "2024"

[features]
default = []
defmt = ["inkpaper-ui/defmt"]
trace = ["inkpaper-trace/recording", "inkpaper-reader/trace"]

[dependencies]
inkpaper-epub = { path = "../epub" }
inkpaper-reader = { path = "../reader" }
inkpaper-trace = { path = "../trace" }
inkpaper-ui = { path = "../ui", features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zune-core = { version = "=0.5.3", default-features = false }
zune-jpeg = { version = "=0.5.15", default-features = false }
zune-png = { version = "=0.5.2", default-features = false }

[dev-dependencies]
futures-lite = { workspace = true }
