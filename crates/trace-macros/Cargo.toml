[package]
name = "inkpaper-trace-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
[dev-dependencies]
# the doc examples use the macro through the crate that re-exports it
inkpaper-trace = { path = "../trace" }
