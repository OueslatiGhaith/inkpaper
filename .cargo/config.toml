[target.xtensa-esp32s3-none-elf]
runner = [
    "probe-rs",
    "run",
    "--chip=esp32s3",
    "--preverify",
    "--always-print-stacktrace",
    "--log-format",
    "{t:dimmed} {L:severity:bold} {s:werror}\n\t{fff:dimmed}:{l:dimmed}",
]

rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-Wl,-Tlinkall.x",
    "-C", "link-arg=-Tdefmt.x"
]

[env]
DEFMT_LOG = "info"

[unstable]
build-std = ["core", "alloc"]
