[package]
name = "inkpaper-x4-pro"
version = "0.1.0"
edition = "2024"

[dependencies]

bm8563 = { path = "../../crates/bm8563" }
cw2017 = { path = "../../crates/cw2017" }
embedded-graphics = { workspace = true }
embedded-hal-async = { workspace = true }
epd-bus = { path = "../../crates/epd-bus" }
frontlight = { path = "../../crates/frontlight" }
gt911 = { path = "../../crates/gt911" }
inkpaper-app = { path = "../../crates/app" }
inkpaper-ui = { path = "../../crates/ui" }
ssd1677 = { path = "../../crates/ssd1677" }
uc8179 = { path = "../../crates/uc8179" }
uc8279-x4 = { path = "../../crates/uc8279-x4" }
xteink-display-probe = { path = "../../crates/xteink-display-probe" }

[target.'cfg(target_arch = "xtensa")'.dependencies]
aligned = "0.4.3"
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
block-device-driver = "0.2.0"
esp-backtrace = { workspace = true, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3"] }
esp-hal = { workspace = true, features = ["esp32s3", "unstable"] }
esp-println = { workspace = true, features = ["esp32s3"] }
esp-rtos = { workspace = true, features = ["esp32s3", "embassy"] }
sdio = "0.5.1"
static_cell = "2.1.1"
