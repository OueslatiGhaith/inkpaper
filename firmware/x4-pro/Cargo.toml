[package]
name = "inkpaper-x4-pro"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-graphics = { workspace = true }
epd-bus = { path = "../../crates/epd-bus" }
ssd1677 = { path = "../../crates/ssd1677" }
uc8179 = { path = "../../crates/uc8179" }
uc8279-x4 = { path = "../../crates/uc8279-x4" }
xteink-display-probe = { path = "../../crates/xteink-display-probe" }

[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.2", features = ["esp32s3", "unstable"] }
# esp-hal 1.1.2 still uses the register names generated by esp32s3 0.35.2.
# 0.35.3 changed those names in a patch release and does not compile with it.
esp32s3 = "=0.35.2"
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy"] }
static_cell = "2.1.1"
